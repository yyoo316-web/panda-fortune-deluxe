<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panda Fortune Deluxe</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-wrap">
    <h1 class="logo">Panda Fortune <span>Deluxe</span></h1>

    <div class="hud">
      <div class="hud-box">
        <div class="hud-label">BALANCE</div>
        <div class="hud-value" id="balanceVal">1,000</div>
      </div>
      <div class="hud-box hud-win">
        <div class="hud-label">WIN</div>
        <div class="hud-value" id="winVal">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">BET</div>
        <div class="bet-row">
          <button id="betDown" class="bet-btn">−</button>
          <div class="hud-value" id="betVal">10</div>
          <button id="betUp" class="bet-btn">+</button>
        </div>
      </div>
    </div>

    <div class="reels-frame">
      <div class="reels" id="reels">
        <div class="reel" data-reel="0"><div class="strip"></div></div>
        <div class="reel" data-reel="1"><div class="strip"></div></div>
        <div class="reel" data-reel="2"><div class="strip"></div></div>
        <div class="reel" data-reel="3"><div class="strip"></div></div>
        <div class="reel" data-reel="4"><div class="strip"></div></div>
      </div>
      <div class="payline"></div>
    </div>

    <div class="controls">
      <button id="paytableBtn" class="side-btn">PAYTABLE</button>
      <button id="spinBtn" class="spin-btn">SPIN</button>
      <button id="autoBtn" class="side-btn auto-btn">AUTO</button>
    </div>

    <button id="muteBtn" class="mute-btn">🔊</button>

    <div id="statusMsg" class="status-msg"></div>

    <div id="paytablePanel" class="paytable-panel">
      <div class="paytable-inner">
        <div class="paytable-header">
          <h2>Paytable</h2>
          <button id="paytableClose" class="close-btn">✕</button>
        </div>
        <table class="paytable">
          <thead>
            <tr><th>Symbol</th><th>x3</th><th>x4</th><th>x5</th><th></th></tr>
          </thead>
          <tbody id="paytableBody"></tbody>
        </table>
        <p class="paytable-note">10 paylines. Bamboo WILD substitutes for all symbols except Scatter. 3+ Scatters pay anywhere.</p>
      </div>
    </div>
  </div>

  <script src="sound.js"></script>
  <script src="game.js"></script>
</body>
</html>
